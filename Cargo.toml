[workspace]
members = [
  "crates/docx2typst",
  "crates/docx2typst-cli",
  "crates/docx2typst-emit",
  "crates/docx2typst-model",
  "crates/docx2typst-node",
  "crates/docx2typst-opc",
  "crates/docx2typst-validate",
  "crates/docx2typst-wml",
]
exclude = ["app/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.89"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/pdfs-build/docx2typst"
readme = "README.md"
keywords = ["docx", "typst", "office", "converter", "wordprocessingml"]
categories = ["command-line-utilities", "parser-implementations"]

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
bytes = "1.10.1"
clap = { version = "4.5.39", features = ["derive"] }
indexmap = { version = "2.9.0", features = ["serde"] }
lopdf = "0.35.0"
napi = { version = "3.3.0", features = ["napi4"] }
napi-derive = "3.2.5"
pdf-extract = "0.10.0"
roxmltree = "0.20.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
toml = "0.8.23"
typst = "0.14.2"
typst-as-lib = { version = "0.15.4", default-features = false, features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-kit = { version = "0.14.2", default-features = false, features = ["fonts", "embed-fonts"] }
typst-pdf = "0.14.2"
typst-syntax = "0.14.2"
walkdir = "2.5.0"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
